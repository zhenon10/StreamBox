# Copy to /etc/nginx/sites-available/ivplayer.tr
# Certbot will add listen 443 ssl + certificate lines on the live host.
# Web player: https://ivplayer.tr/app/  (files in /var/www/ivplayer.tr/app/)

server {
    listen 80;
    listen [::]:80;
    server_name ivplayer.tr www.ivplayer.tr;
    root /var/www/ivplayer.tr;
    index index.html;

    location = /app {
        return 302 /app/;
    }

    # SPA (Vite base=/app/, React Router basename=/app)
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
