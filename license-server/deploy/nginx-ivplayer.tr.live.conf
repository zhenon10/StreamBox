# Live HTTPS layout (Certbot cert covers ivplayer.tr + www).
# Apex serves the site. www 301 → https://ivplayer.tr$request_uri

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ivplayer.tr;
    ssl_certificate /etc/letsencrypt/live/ivplayer.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivplayer.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://ivplayer.tr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ivplayer.tr;
    root /var/www/ivplayer.tr;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ivplayer.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivplayer.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /app {
        return 302 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ivplayer.tr www.ivplayer.tr;
    return 301 https://ivplayer.tr$request_uri;
}
