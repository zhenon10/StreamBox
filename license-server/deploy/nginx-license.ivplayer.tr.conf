# Extra vhost only — does not replace other sites.
# After certbot, keep TLS lines; ensure /v1/stream-proxy has access_log off
# so playlist/stream credentials in ?url= are not written to access.log.

# HTTP → HTTPS is managed by Certbot on the live host.
# This file is the logical template for proxy locations.

# --- HTTPS server (conceptual; live file also has ssl_* from Certbot) ---
# server {
#   server_name license.ivplayer.tr;
#   listen 443 ssl;
#   ...
#
#   # CRITICAL: do not log query string (may contain panel user/pass/token)
#   location /v1/stream-proxy {
#       access_log off;
#       proxy_pass http://127.0.0.1:8787;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-For $remote_addr;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_buffering off;
#       proxy_read_timeout 3600s;
#       proxy_send_timeout 3600s;
#   }
#
#   location / {
#       proxy_pass http://127.0.0.1:8787;
#       ...
#   }
# }

server {
    listen 80;
    listen [::]:80;
    server_name license.ivplayer.tr;

    location /v1/stream-proxy {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Browser player lives on apex: https://ivplayer.tr/app/
    location /app {
        return 301 https://ivplayer.tr$request_uri;
    }

    # PayTR Bildirim URL (Mağaza Paneli): https://license.ivplayer.tr/v1/payments/paytr/callback
    # Do not put basic-auth in front of this path. Callback body has no card data; still avoid logging POST body.
    location /v1/payments/ {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
