<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamBox Lisans Yönetimi</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --panel2: #243040;
      --border: #334155;
      --text: #e8eef5;
      --muted: #94a3b8;
      --accent: #0d9488;
      --accent-hover: #14b8a6;
      --danger: #dc2626;
      --warn: #d97706;
      --ok: #16a34a;
      --font: "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, #1e3a3a 0%, transparent 55%),
                  radial-gradient(900px 500px at 100% 0%, #1a2740 0%, transparent 50%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 20, 25, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header h1 span { color: var(--accent); }
    header p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.9rem; }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
      display: grid;
      gap: 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
    }
    .card h2 {
      margin: 0 0 1rem;
      font-size: 1.1rem;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input, select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.85rem;
      margin-bottom: 0.85rem;
    }
    .row.full { grid-template-columns: 1fr; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--panel2);
      color: var(--text);
    }
    button.primary { background: var(--accent); color: #042f2e; }
    button.primary:hover { background: var(--accent-hover); }
    button.danger { background: transparent; color: #fca5a5; border: 1px solid #7f1d1d; }
    button.danger:hover { background: var(--danger); color: white; border-color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-bar {
      display: flex;
      gap: 0.6rem;
      align-items: end;
    }
    .auth-bar > div { min-width: 220px; }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .msg.show { display: block; }
    .msg.ok { background: #14532d55; color: #86efac; border: 1px solid #166534; }
    .msg.err { background: #7f1d1d55; color: #fecaca; border: 1px solid #991b1b; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .mono { font-family: var(--mono); font-size: 0.85rem; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.ok { background: #14532d; color: #86efac; }
    .badge.expired { background: #7f1d1d; color: #fecaca; }
    .badge.warn { background: #78350f; color: #fde68a; }
    .url {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      display: block;
    }
    .devices {
      margin-top: 0.4rem;
      padding: 0.5rem 0.65rem;
      background: var(--bg);
      border-radius: 8px;
      font-size: 0.8rem;
    }
    .devices:empty { display: none; }
    .device-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0;
    }
    .empty { color: var(--muted); padding: 1.5rem 0; text-align: center; }
    @media (max-width: 700px) {
      header, main { padding-left: 1rem; padding-right: 1rem; }
      .url { max-width: 140px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Stream<span>Box</span> Lisans</h1>
      <p>Kod · playlist URL · cihaz limiti</p>
    </div>
    <div class="auth-bar">
      <div>
        <label for="adminKey">Admin anahtarı (varsayılan: streambox-admin)</label>
        <input id="adminKey" type="text" value="streambox-admin" placeholder="streambox-admin" autocomplete="off" spellcheck="false" />
      </div>
      <button type="button" class="primary" id="btnLoad">Yükle</button>
    </div>
  </header>

  <main>
    <div id="flash" class="msg"></div>

    <section class="card">
      <h2>Yeni / güncelle kod</h2>
      <form id="codeForm">
        <div class="row">
          <div>
            <label for="code">Aktivasyon kodu</label>
            <input id="code" required placeholder="ORNEK-2026" class="mono" />
          </div>
          <div>
            <label for="planName">Plan adı</label>
            <input id="planName" required placeholder="Aylık" />
          </div>
          <div>
            <label for="maxDevices">Cihaz limiti</label>
            <input id="maxDevices" type="number" min="1" max="50" value="1" required />
          </div>
          <div>
            <label for="expiresAt">Bitiş tarihi</label>
            <input id="expiresAt" type="date" required />
          </div>
        </div>
        <div class="row full">
          <div>
            <label for="playlistUrl">Playlist URL (M3U)</label>
            <input id="playlistUrl" type="url" required placeholder="https://panel.ornek/get.php?..." />
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="primary">Kaydet</button>
          <button type="button" id="btnClear">Formu temizle</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Kodlar <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
      <div id="list"><p class="empty">Yüklemek için admin anahtarını girin.</p></div>
    </section>
  </main>

  <script>
    const KEY_STORAGE = 'sb_license_admin_key';
    const $ = (id) => document.getElementById(id);

    const adminKeyInput = $('adminKey');
    const flash = $('flash');
    const list = $('list');
    const form = $('codeForm');

    const savedKey = localStorage.getItem(KEY_STORAGE);
    adminKeyInput.value = savedKey && savedKey.trim() ? savedKey : 'streambox-admin';

    function setDefaultExpiry() {
      const d = new Date();
      d.setFullYear(d.getFullYear() + 1);
      $('expiresAt').value = d.toISOString().slice(0, 10);
    }
    setDefaultExpiry();

    function showMsg(text, ok) {
      flash.textContent = text;
      flash.className = 'msg show ' + (ok ? 'ok' : 'err');
      setTimeout(() => { flash.className = 'msg'; }, 4000);
    }

    function headers() {
      const key = adminKeyInput.value.trim();
      localStorage.setItem(KEY_STORAGE, key);
      return {
        'Content-Type': 'application/json',
        'X-Admin-Key': key,
      };
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { ...headers(), ...(options.headers || {}) },
      });
      const data = await res.json().catch(() => ({ ok: false, error: 'unknown' }));
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || ('HTTP ' + res.status));
      }
      return data;
    }

    function fmtDate(ms) {
      return new Date(ms).toLocaleDateString('tr-TR');
    }

    function statusBadge(expiresAt) {
      if (Date.now() > expiresAt) {
        return '<span class="badge expired">Süresi dolmuş</span>';
      }
      const days = (expiresAt - Date.now()) / 86400000;
      if (days < 14) return '<span class="badge warn">Yakında bitiyor</span>';
      return '<span class="badge ok">Aktif</span>';
    }

    function shortId(id) {
      const clean = String(id || '').replace(/[^a-zA-Z0-9]/g, '');
      return clean.length <= 10 ? clean : clean.slice(-10);
    }

    function render(codes) {
      $('count').textContent = '(' + codes.length + ')';
      if (!codes.length) {
        list.innerHTML = '<p class="empty">Henüz kod yok.</p>';
        return;
      }

      const rows = codes.map((c) => {
        const devices = (c.devices || []).map((d) => `
          <div class="device-row">
            <span class="mono" title="${escapeHtml(d.deviceId)}">${escapeHtml(shortId(d.deviceId))}
              ${d.deviceLabel ? ' · ' + escapeHtml(d.deviceLabel) : ''}
              · ${fmtDate(d.activatedAt)}
            </span>
            <button type="button" class="danger" data-revoke="${escapeHtml(d.token)}">Kaldır</button>
          </div>
        `).join('');

        return `
          <tr>
            <td>
              <div class="mono"><strong>${escapeHtml(c.code)}</strong></div>
              <div style="color:var(--muted);margin-top:0.2rem">${escapeHtml(c.planName)}</div>
              ${statusBadge(c.expiresAt)}
            </td>
            <td>
              <span class="url" title="${escapeHtml(c.playlistUrl)}">${escapeHtml(c.playlistUrl)}</span>
            </td>
            <td>${c.deviceCount} / ${c.maxDevices}</td>
            <td>${fmtDate(c.expiresAt)}</td>
            <td>
              <div class="actions">
                <button type="button" data-edit="${escapeHtml(c.code)}">Düzenle</button>
                <button type="button" class="danger" data-delete="${escapeHtml(c.code)}">Sil</button>
              </div>
              <div class="devices">${devices || '<span style="color:var(--muted)">Cihaz yok</span>'}</div>
            </td>
          </tr>
        `;
      }).join('');

      list.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Kod / Plan</th>
              <th>Playlist URL</th>
              <th>Cihaz</th>
              <th>Bitiş</th>
              <th>İşlem</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      list.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const code = btn.getAttribute('data-edit');
          const item = codes.find((x) => x.code === code);
          if (!item) return;
          $('code').value = item.code;
          $('planName').value = item.planName;
          $('playlistUrl').value = item.playlistUrl;
          $('maxDevices').value = String(item.maxDevices);
          $('expiresAt').value = new Date(item.expiresAt).toISOString().slice(0, 10);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      list.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const code = btn.getAttribute('data-delete');
          if (!confirm(code + ' silinsin mi? Bağlı cihazlar da kalkar.')) return;
          try {
            await api('/v1/admin/codes/' + encodeURIComponent(code), { method: 'DELETE' });
            showMsg(code + ' silindi', true);
            await load();
          } catch (e) {
            showMsg(e.message, false);
          }
        });
      });

      list.querySelectorAll('[data-revoke]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const token = btn.getAttribute('data-revoke');
          if (!confirm('Bu cihazın lisansı kaldırılsın mı?')) return;
          try {
            await api('/v1/admin/activations/' + encodeURIComponent(token), { method: 'DELETE' });
            showMsg('Cihaz kaldırıldı', true);
            await load();
          } catch (e) {
            showMsg(e.message, false);
          }
        });
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function load() {
      if (!adminKeyInput.value.trim()) {
        adminKeyInput.value = 'streambox-admin';
      }
      try {
        const data = await api('/v1/admin/codes');
        render(data.codes || []);
        showMsg('Kodlar yüklendi', true);
      } catch (e) {
        if (e.message === 'unauthorized') {
          localStorage.removeItem(KEY_STORAGE);
          adminKeyInput.value = 'streambox-admin';
          showMsg('Yetkisiz — alan sıfırlandı. Tekrar Yükle’ye basın (streambox-admin).', false);
          list.innerHTML =
            '<p class="empty">Anahtar: <strong>streambox-admin</strong> yazıp Yükle’ye basın.</p>';
          return;
        }
        list.innerHTML = '<p class="empty">Yüklenemedi: ' + escapeHtml(e.message) + '</p>';
        showMsg(e.message, false);
      }
    }

    $('btnLoad').addEventListener('click', () => load());

    $('btnClear').addEventListener('click', () => {
      form.reset();
      setDefaultExpiry();
      $('maxDevices').value = '1';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const expiresDay = $('expiresAt').value;
      const expiresAt = new Date(expiresDay + 'T23:59:59').getTime();
      const body = {
        code: $('code').value.trim(),
        planName: $('planName').value.trim(),
        playlistUrl: $('playlistUrl').value.trim(),
        maxDevices: Number($('maxDevices').value),
        expiresAt,
      };
      try {
        await api('/v1/admin/codes', { method: 'POST', body: JSON.stringify(body) });
        showMsg(body.code.toUpperCase() + ' kaydedildi', true);
        form.reset();
        setDefaultExpiry();
        $('maxDevices').value = '1';
        await load();
      } catch (err) {
        showMsg(err.message, false);
      }
    });

    if (adminKeyInput.value) load();
  </script>
</body>
</html>
